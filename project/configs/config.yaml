DATA_DIR: data

paths:
  images_test: data/images/test
  labels_test: data/labels/test
  images_train: data/images/train_v2
  labels_train: data/labels/train_v2
  images_val: data/images/val
  labels_val: data/labels/val
  artifacts: artifacts

model:
  classes:
    - stamp

cv_baseline:
  expected_aspect_ratio: 3.55
  ar_tolerance: 0.25
  min_width_px: 100
  min_height_px: 30
  block_size: 11
  adaptive_threshold_c: 5

yolo:
  model_name: yolov8n
  epochs: 50
  imgsz: 640
  batch: 16
  device: cpu
  seed: 42
  deterministic: true
  rect: true
  mosaic: 0.0
  single_cls: true
  project: artifacts
  name: yolo_train

rcnn:
  num_epochs: 30
  batch_size: 4
  learning_rate: 0.001
  imgsz: 640

hybrid:
  iou_threshold: 0.3
  ar_refine_tolerance: 0.15

synthetic:
  donor_count: 4
  donor_random_state: 42
  num_gost: 250
  num_copypaste: 250

evaluation:
  iou_thresholds:
    - 0.3
    - 0.5
    - 0.75
