DATA_DIR: data

paths:
  images_test: data/images/test
  labels_test: data/labels/test
  images_train: data/images/train_v4
  labels_train: data/labels/train_v4
  images_val_honest: data/images/val_honest
  labels_val_honest: data/labels/val_honest
  artifacts: artifacts

model:
  classes:
    - stamp

cv_baseline:
  expected_aspect_ratio: 3.36
  ar_tolerance: 0.15
  min_width_px: 300
  min_height_px: 80
  min_area_px: 15000
  max_width_px: 5000
  roi_width_ratio: 0.5
  roi_height_ratio: 0.5
  block_size: 11
  adaptive_threshold_c: 5

yolo:
  model_name: yolov8n
  epochs: 50
  imgsz: 640
  batch: 16
  device: cpu
  seed: 42
  deterministic: true
  rect: true
  mosaic: 0.0
  single_cls: true
  project: artifacts
  name: yolo_train

rcnn:
  num_epochs: 30
  batch_size: 4
  learning_rate: 0.001
  imgsz: 640

hybrid:
  iou_threshold: 0.3
  ar_refine_tolerance: 0.15

synthetic:
  donor_count: 4
  donor_random_state: 42
  num_total: 500
  num_gost: 50
  num_copypaste: 250
  # num_gost_on_bg = num_total - num_gost - num_copypaste = 200

evaluation:
  iou_thresholds:
    - 0.3
    - 0.5
    - 0.75
